services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openself
      POSTGRES_DB: openself
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["production_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openself"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes: ["production_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  production_postgres:
  production_redis:
