name: Bug report
description: Describe a reproducible bug
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: Version
      description: Installed version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: Tell us what happened
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux]
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: I can reproduce the bug
